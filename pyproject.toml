[project]
name = "applicant-zero"
version = "0.1.0"
description = "Private job discovery and application preparation prototype"
requires-python = ">=3.11"

[project.optional-dependencies]
browser = ["playwright>=1.51,<2"]
resume = ["pypdf>=5,<7"]
gmail = ["google-api-python-client>=2.160,<3", "google-auth-httplib2>=0.2,<1", "google-auth-oauthlib>=1.2,<2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
